<head>
  <meta charset="utf-8">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="An immersive web music player and catalog dedicated to streaming and exploring the discography of Hev Abi.">
  <meta name="theme-color" content="#070B0E">

  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/brand/hevnem-base.ico" type="image/x-icon">
  <script>
    try {
      var isReload = sessionStorage.getItem('hevnem:session_reloading') === 'true' || localStorage.getItem('hevnem:intro_seen') === 'true';
      if (!isReload) {
        document.documentElement.classList.add('intro-pending');
      }
    } catch (e) {}
  </script>
</head>

<body>
  <app-root></app-root>

  <script>
    document.addEventListener('contextmenu', (event) => {
      if (event.target.closest('img, svg, picture')) {
        event.preventDefault();
      }
    });
  </script>
</body>

</html>
