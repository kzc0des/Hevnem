<div class="flex gap-4 items-center bg-hev-glass rounded-2xl p-2 drop-shadow-hev-glass">
    <img class="w-20 h-20 object-cover rounded-2xl" [src]="album().thumbnail" alt="">
    <section class="space-y-2">
        @if (album().name === "Featuring") {
        <h3 class="display text-lg">Single Tracks</h3>
        }@else{
        <h3 class="display text-xl">{{ album().name }}</h3>
        }
        <div class="flex gap-2 text-hev-ink-3 text-lg">
            <span>Album</span>
            <span>&#8226;</span>
            <span>{{ album().tracks }} tracks</span>
        </div>
    </section>
</div>
