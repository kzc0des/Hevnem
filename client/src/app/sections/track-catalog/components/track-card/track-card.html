<div (click)="playTrack()"
    class="group flex items-center justify-between px-4 py-3 rounded-2xl cursor-pointer transition-all duration-200 select-none"
    [class.bg-hev-glass-2]="isActive()" [class.border]="isActive()" [class.border-white/10]="isActive()"
    [class.shadow-lg]="isActive()" [class.hover:bg-hev-glass]="!isActive()">

    <div class="flex items-center gap-4 min-w-0">
        <div class="w-6 flex items-center justify-center">
            @if (isActive()) {
            <div class="flex items-end gap-1 h-4">
                <span class="w-1 h-3 bg-hev-cream rounded-full animate-pulse"></span>
                <span class="w-1 h-4 bg-hev-cream rounded-full"></span>
                <span class="w-1 h-2.5 bg-hev-cream rounded-full animate-pulse"></span>
            </div>
            }
            @else {
            <span class="text-sm font-medium text-hev-ink-3 group-hover:text-hev-ink-2">
                {{ trackNumber() }}
            </span>
            }
        </div>

        <span class="text-base font-semibold truncate transition-colors" [class.text-hev-cream]="isActive()"
            [class.text-hev-ink-1]="!isActive()" [class.group-hover:text-white]="!isActive()">
            {{ song().name }}
        </span>
    </div>

    <span class="text-sm font-medium ml-4 shrink-0" [class.text-hev-cream/80]="isActive()"
        [class.text-hev-ink-3]="!isActive()">
        {{ song().duration }}
    </span>
</div>
