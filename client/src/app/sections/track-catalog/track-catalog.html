<div class="flex flex-col px-2">
    <section class="flex justify-between items-center px-4 py-2 text-hev-ink-3 text-sm">
        <p class="tracking-[.25em] font-semibold uppercase opacity-75">TRACKLIST</p>
        <p class="opacity-75">{{ catalogService.currentSongs().length }} tracks</p>
    </section>

    <section class="mt-1 max-h-120 overflow-y-auto scroll-smooth custom-scrollbar pr-1.5">
        <ul class="space-y-3">
            @for(song of catalogService.currentSongs(); track song.id; let i = $index) {
            <li class="animate-track-enter" [style.animation-delay]="(i * 35) + 'ms'">
                <app-track-card [song]="song" [index]="i + 1" />
            </li>
            }
        </ul>
    </section>
</div>
