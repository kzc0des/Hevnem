<div class="flex items-center gap-3.5">
    <img [src]="resolvedCover()" [alt]="currentSong().name"
        (error)="handleImageError()"
        class="w-16 h-16 rounded-xl object-cover shadow-md border border-white/10 shrink-0" />
    <div class="flex flex-col min-w-0 max-w-45">
        <span class="text-lg font-semibold truncate text-white leading-tight">
            {{ songTitle() }}
        </span>
        <span class="text-hev-ink-2/70 truncate mt-0.5">
            Hev Abi
        </span>
    </div>
</div>
