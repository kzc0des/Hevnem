<section class="w-full max-w-380 mx-auto flex justify-between items-center px-8 lg:px-10 py-5">
    <div class="flex items-center gap-4">
        <span class="text-3xl display">Hevnem</span>
        <span class="text-3xl"> | </span>
        <div class="flex items-center gap-3 opacity-60 text-lg">
            <span> Timog </span>
            <span>&#8226;</span>
            <span>QC</span>
        </div>
    </div>

    <div class="flex items-center transition-opacity duration-500"
        [class.opacity-0]="layout.isImmersive() && layout.isIdle()"
        [class.pointer-events-none]="layout.isImmersive() && layout.isIdle()">
        @if (layout.isImmersive()) {
        <button (click)="layout.exitImmersive()"
            class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-black/40 hover:bg-black/60 text-white/90 border border-white/10 text-xs font-hev-ui tracking-wider transition backdrop-blur-md cursor-pointer select-none"
            title="Exit Idle (Esc or F)">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
            <span>Exit (F)</span>
        </button>
        } @else {
        <button (click)="layout.enterImmersive()"
            class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-black/20 hover:bg-black/40 text-white/80 hover:text-white border border-white/10 text-xs font-hev-ui tracking-wider transition backdrop-blur-md cursor-pointer select-none"
            title="Enter Idle Mode (F)">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="14" width="15" height="5" rx="1" />
                <line x1="6.5" y1="14" x2="6.5" y2="19" />
                <path d="M15 10c.8-1.5-.8-2.8 0-4.3s.8-2.8 0-4.2" />
                <path d="M19 11c1-1.8-1-3.2 0-5s1-3.2 0-4.8" />
            </svg>
            <span>Idle</span>
        </button>
        }
    </div>
</section>
