<div [style.background]="background.currentBackground()" [style.--album-accent]="background.currentAccent()"
    class="relative h-screen flex flex-col justify-between overflow-hidden">
    <app-top-nav-bar class="relative z-10" />
    <img src="/brand/maginoo-pilyo-logo.png" alt="maginoo-pilyo"
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-3 max-w-[75vw] max-h-[75vh] select-none z-">

    <main class="relative z-10 flex-1 min-h-0 flex items-center w-full px-8 lg:px-10">
        <section class="w-full flex justify-between items-center gap-8">
            <div class="w-80 shrink-0">
                <app-album-catalog />
            </div>
            <div class="flex-1 flex justify-center">
                <app-now-playing-card />
            </div>
            <div class="w-80 shrink-0">
                <app-track-catalog />
            </div>
        </section>
    </main>

    <footer class="relative z-10 shrink-0 pb-6 px-8 lg:px-12 w-full">
        <div class="w-full mx-auto">
            <app-playback-track-widget />
        </div>
    </footer>

</div>
