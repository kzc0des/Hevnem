<div [style.--album-accent]="background.currentAccent()"
    class="relative h-dvh flex flex-col justify-between overflow-hidden"
    [class.cursor-none]="background.isImmersive() && background.isIdle()">

    <app-intro-sequence />

    <div [style.background]="background.baseBackground()" class="absolute inset-0 pointer-events-none z-0">
    </div>
    <div [style.background]="background.incomingBackground()"
        class="absolute inset-0 pointer-events-none z-0 transition-opacity duration-800 ease-in-out"
        [class.opacity-100]="background.isFading()" [class.opacity-0]="!background.isFading()">
    </div>

    <app-top-nav-bar class="relative z-10 shrink-0" />
    <img src="/brand/maginoo-pilyo-logo.png" alt="maginoo-pilyo"
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-8 max-w-[75vw] max-h-[75vh] select-none z-0">

    <main #stageContainer class="relative z-10 flex-1 min-h-0 flex items-center w-full px-4 sm:px-8 lg:px-10 will-change-transform"
        [class.pointer-events-none]="background.activeDrawer() !== null">
        <section
            class="w-full max-w-380 mx-auto flex justify-center lg:justify-between items-center transition-all duration-600 ease-in-out"
            [class.gap-8]="!background.isImmersive()" [class.gap-0]="background.isImmersive()">

            <div class="hidden lg:block shrink-0 transition-all duration-600 ease-in-out"
                [class.w-110]="!background.isImmersive()" [class.w-0]="background.isImmersive()"
                [class.opacity-0]="background.isImmersive()" [class.pointer-events-none]="background.isImmersive()"
                [class.overflow-hidden]="background.isImmersive()">
                <app-album-catalog />
            </div>

            <div class="flex-1 flex justify-center max-w-full">
                <app-now-playing-card />
            </div>

            <div class="hidden lg:block shrink-0 transition-all duration-600 ease-in-out"
                [class.w-110]="!background.isImmersive()" [class.w-0]="background.isImmersive()"
                [class.opacity-0]="background.isImmersive()" [class.pointer-events-none]="background.isImmersive()"
                [class.overflow-hidden]="background.isImmersive()">
                <app-track-catalog />
            </div>
        </section>
    </main>

    <footer #playbackDock class="relative z-10 shrink-0 px-3 sm:px-8 lg:px-12 w-full pb-[max(2.5rem,calc(env(safe-area-inset-bottom)+1.5rem))] sm:pb-[max(1rem,calc(env(safe-area-inset-bottom)+0.5rem))] lg:pb-4 will-change-transform">
        <div class="w-full max-w-380 mx-auto">
            <app-playback-track-widget />
        </div>
    </footer>

    <div class="lg:hidden fixed inset-0 z-50 transition-opacity duration-300"
        [class.opacity-100]="background.activeDrawer() !== null" [class.opacity-0]="background.activeDrawer() === null"
        [class.pointer-events-none]="background.activeDrawer() === null"
        [class.pointer-events-auto]="background.activeDrawer() !== null">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm cursor-pointer" (click)="background.closeDrawer()">
        </div>

        <div class="absolute bottom-0 left-0 right-0 h-[75vh] max-h-[75vh] bg-[#0c131a]/95 backdrop-blur-2xl border-t border-white/15 rounded-t-3xl shadow-2xl flex flex-col transition-transform duration-300 ease-out pb-[max(1rem,env(safe-area-inset-bottom))] z-10 pointer-events-auto"
            [class.translate-y-0]="background.activeDrawer() !== null"
            [class.translate-y-full]="background.activeDrawer() === null">

            <div class="pt-3 pb-2 px-5 flex items-center justify-between border-b border-white/10 shrink-0">
                <span class="text-xs font-semibold uppercase tracking-[0.25em] text-hev-ink-3">
                    {{ background.activeDrawer() === 'albums' ? 'Albums' : 'Tracklist' }}
                </span>
                <div class="w-10 h-1 bg-white/20 rounded-full mx-auto"></div>
                <button (click)="background.closeDrawer()"
                    class="w-7 h-7 flex items-center justify-center rounded-full bg-white/10 text-white/80 hover:text-white transition cursor-pointer"
                    title="Close">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="p-3 overflow-y-auto flex-1 min-h-0 custom-scrollbar overscroll-contain">
                @if (background.activeDrawer() === 'albums') {
                <app-album-catalog />
                } @else if (background.activeDrawer() === 'tracks') {
                <app-track-catalog />
                }
            </div>
        </div>
    </div>
</div>
